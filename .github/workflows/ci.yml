name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The checks need the dev dependencies: @opencode/plugin for the plugin test,
      # typescript and bun-types for the typecheck. The process tests still exercise
      # the real enumeration on each platform.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
